
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o que tem pra assistir na TV?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Electrolize&family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505; --surface:#0b110b; --surface2:#0f1a0f; --line:#16361a;
    --text:#ffffff; --muted:#7fa882; --accent:#9FF85D; --accent-dim:#1c6b1c;
    --warn:#f8d65d; --btn-text:#000000;
  }
  ::selection{background:var(--accent); color:var(--btn-text)}
  body.roxo{
    --bg:#0B0910; --surface:#141020; --surface2:#1B1730; --line:#2A2342;
    --text:#ECEAF4; --muted:#8B85A3; --accent:#9FF85D; --accent-dim:#3a5e26;
  }
  .theme-btn{
    flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:11px; cursor:pointer;
    background:var(--surface); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; text-transform:lowercase; transition:.15s;
    white-space:nowrap; margin-top:2px;
  }
  .theme-btn:hover{color:var(--accent); border-color:var(--accent-dim)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; line-height:1.45;
    -webkit-font-smoothing:antialiased; padding-bottom:90px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 16px}

  header{
    position:sticky; top:0; z-index:30; background:rgba(5,5,5,.92);
    backdrop-filter:blur(10px);
  }
  .head-inner{max-width:760px; margin:0 auto; padding:14px 16px 10px}
  .head-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  h1{
    font-family:"Electrolize",sans-serif; font-weight:400; letter-spacing:.04em;
    font-size:clamp(16px,4.6vw,22px); line-height:1.2; margin:0; min-width:0;
    text-transform:lowercase; color:var(--text);
  }
  h1 .sig{color:var(--accent)}
  .meta{font-family:"VT323",monospace; font-size:15px; color:var(--muted); letter-spacing:.02em; margin-top:5px}

  .controls{display:flex; flex-direction:column; gap:9px; margin-top:11px}
  .days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:12px;
    background:var(--surface); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:7px 13px; cursor:pointer; white-space:nowrap;
    text-transform:lowercase; transition:.15s;
  }
  .day:hover{color:var(--text)}
  .day.on{background:var(--accent); color:#050505; border-color:var(--accent); font-weight:500}
  .row2{display:flex; gap:8px}
  .search{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-family:inherit; font-size:14px; padding:9px 12px;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:2px solid var(--accent-dim); outline-offset:1px; border-color:var(--accent-dim)}
  .periods{display:flex; gap:5px}
  .per{
    font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--surface);
    color:var(--muted); border:1px solid var(--line); border-radius:8px;
    padding:8px 9px; cursor:pointer; text-transform:lowercase; transition:.15s;
  }
  .per.on{color:var(--accent); border-color:var(--accent-dim)}

  main{padding-top:16px}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden;
  }
  .card-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; cursor:pointer; user-select:none; transition:background .12s;
  }
  .card-head:hover{background:var(--surface2)}
  .card-name{
    font-family:"Electrolize",sans-serif; font-size:14px; letter-spacing:.05em;
    color:var(--accent); text-transform:lowercase;
  }
  .card-meta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
    display:flex; align-items:center; gap:8px}
  .chev{display:inline-block; transition:transform .2s; font-size:13px}
  .card.open .chev{transform:rotate(180deg)}
  .card-body{display:none; padding:0 14px 6px}
  .card.open .card-body{display:block}

  .p{
    display:grid; grid-template-columns:58px 1fr 26px; gap:12px; align-items:start;
    padding:13px 4px; border-top:1px solid var(--line);
  }
  .p.sel{background:var(--surface2); border-radius:9px}
  .p-time{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--accent); padding-top:1px}
  .p-time .dur{display:block; font-size:9px; color:var(--muted); margin-top:1px}
  .p-ttl{font-size:14.5px; font-weight:600}
  .p-sub{font-size:13px; color:var(--text); font-style:italic; margin-top:1px; opacity:.85}
  .p-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
  .tag{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted);
    background:var(--surface2); border:1px solid var(--line); border-radius:5px; padding:2px 6px}
  .tag-r{color:var(--warn); border-color:var(--warn)}
  .tag-n{color:var(--accent); border-color:var(--accent-dim)}
  .p-desc{font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.5}
  .p-none{font-style:italic; opacity:.6}
  .mark{
    width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line);
    flex:0 0 auto; margin-top:2px; display:grid; place-items:center; color:transparent;
    font-size:13px; cursor:pointer; transition:.12s;
  }
  .mark:hover{border-color:var(--muted)}
  .p.sel .mark{background:var(--accent); border-color:var(--accent); color:#050505}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:40px 0; font-family:"IBM Plex Mono",monospace}

  .cart{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(8,12,8,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); transform:translateY(110%); transition:.22s;
  }
  .cart.show{transform:translateY(0)}
  .cart-inner{max-width:760px; margin:0 auto; padding:13px 16px; display:flex; align-items:center; gap:12px}
  .cart-n{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text); flex:1}
  .cart-n b{color:var(--accent)}
  .btn{
    font-family:"IBM Plex Sans",sans-serif; font-size:13px; font-weight:600;
    border-radius:9px; padding:10px 15px; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--muted);
  }
  .btn.primary{background:var(--accent); color:#050505; border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .note{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted); text-align:center; padding:8px 16px 0; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="head-top">
      <h1>o que tem pra assistir na <span class="sig">tv?</span></h1>
      <button class="theme-btn" id="theme">tema roxo</button>
    </div>
    <div class="meta">grade atualizada · 05/09/2026 12:12 · janela móvel de ~5 dias</div>
    <div class="controls">
      <div class="days" id="days"></div>
      <div class="row2">
        <input class="search" id="search" placeholder="buscar canal ou programa..." autocomplete="off">
        <div class="periods" id="periods">
          <button class="per on" data-p="all">tudo</button>
          <button class="per" data-p="tarde">tarde</button>
          <button class="per" data-p="noite">noite</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="cart" id="cart">
  <div class="cart-inner">
    <div class="cart-n"><b id="cn">0</b> marcados para assistir</div>
    <button class="btn" id="clear">limpar</button>
    <button class="btn primary" id="gcal">google agenda</button>
  </div>
</div>
<div class="note">página gerada localmente · dados da fonte comunitária BrazilTVEPG, não-oficial</div>

<script>
const PROGS = [];
const CANAIS = ["ANIMAL PLANET HD", "ARTE 1 HD", "BAND HD", "BIS HD", "CANAL BRASIL HD", "CANAL UOL", "CULTURA HD", "CURTA", "DISCOVERY HD", "DISCOVERY HOME&HEALTH HD", "DISCOVERY WORLD HD", "E!", "FILM & ARTS", "FUTURA HD", "GLOBO SP", "GNT HD", "HGTV HD", "Modo Viagem", "MULTISHOW HD", "TCM BR", "TLC HD", "TV BRASIL"];
const sel = new Set();
const openSet = new Set();   // canais expandidos
let curDay = null, period = "all", q = "";

const fmtTime = iso => { const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const dayKey = iso => new Date(iso).toLocaleDateString("sv-SE");
const dias = ["dom","seg","ter","qua","qui","sex","sáb"];
const dayLabel = key => { const d=new Date(key+"T12:00:00"); return dias[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); };
const durMin = p => Math.round((new Date(p.e)-new Date(p.s))/60000);

const allDays = [...new Set(PROGS.map(p=>dayKey(p.s)))].sort();
curDay = allDays[0];

function buildDays(){
  const c=document.getElementById("days"); c.innerHTML="";
  allDays.forEach(k=>{
    const b=document.createElement("button");
    b.className="day"+(k===curDay?" on":""); b.textContent=dayLabel(k);
    b.onclick=()=>{curDay=k; buildDays(); render();};
    c.appendChild(b);
  });
}

function inPeriod(p){
  if(period==="all") return true;
  const h=new Date(p.s).getHours();
  if(period==="tarde") return h>=12 && h<18;
  if(period==="noite") return h>=18 || h<2;
  return true;
}

function render(){
  const main=document.getElementById("main"); main.innerHTML="";
  const ql=q.toLowerCase();
  let any=false;
  CANAIS.forEach(ch=>{
    let items=PROGS.filter(p=>p.ch===ch && dayKey(p.s)===curDay && inPeriod(p));
    if(ql) items=items.filter(p=>(p.t+" "+(p.st||"")+" "+p.ch).toLowerCase().includes(ql));
    if(!items.length) return;
    any=true;
    const open = openSet.has(ch) || !!ql;   // busca abre os cards automaticamente
    const card=document.createElement("section");
    card.className="card"+(open?" open":"");

    const head=document.createElement("div"); head.className="card-head";
    head.innerHTML="<span class='card-name'>"+esc(ch.toLowerCase())+"</span>"+
      "<span class='card-meta'>"+items.length+" prog <span class='chev'>▾</span></span>";
    head.onclick=()=>{ if(openSet.has(ch))openSet.delete(ch); else openSet.add(ch); render(); };
    card.appendChild(head);

    const body=document.createElement("div"); body.className="card-body";
    items.forEach(p=>{
      const id=p.ch+"|"+p.s;
      const row=document.createElement("div");
      row.className="p"+(sel.has(id)?" sel":"");
      let tags="";
      if(p.ep)  tags+="<span class='tag'>"+esc(p.ep)+"</span>";
      if(p.cat) tags+="<span class='tag'>"+esc(p.cat)+"</span>";
      if(p.r)   tags+="<span class='tag tag-r'>class. "+esc(p.r)+"</span>";
      if(p.yr)  tags+="<span class='tag'>"+esc(p.yr)+"</span>";
      if(p.n>1) tags+="<span class='tag tag-n'>"+p.n+"x seguidas</span>";
      row.innerHTML=
        "<div class='p-time'>"+fmtTime(p.s)+"<span class='dur'>"+durMin(p)+"min</span></div>"+
        "<div class='p-main'>"+
          "<div class='p-ttl'>"+esc(p.t)+"</div>"+
          (p.st?"<div class='p-sub'>"+esc(p.st)+"</div>":"")+
          (tags?"<div class='p-tags'>"+tags+"</div>":"")+
          (p.d?"<div class='p-desc'>"+esc(p.d)+"</div>":"<div class='p-desc p-none'>sem sinopse</div>")+
        "</div>"+
        "<div class='mark' title='marcar para assistir'>✓</div>";
      row.querySelector(".mark").onclick=e=>{ e.stopPropagation();
        if(sel.has(id))sel.delete(id); else sel.add(id);
        row.classList.toggle("sel"); updateCart(); };
      body.appendChild(row);
    });
    card.appendChild(body);
    main.appendChild(card);
  });
  if(!any) main.innerHTML="<div class='empty'>nada nesse filtro. tenta outro dia ou período.</div>";
}

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function updateCart(){
  document.getElementById("cn").textContent=sel.size;
  document.getElementById("cart").classList.toggle("show", sel.size>0);
}

function icsDate(iso){ return new Date(iso).toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"; }

document.getElementById("search").oninput=e=>{q=e.target.value; render();};
document.getElementById("periods").onclick=e=>{
  if(!e.target.dataset.p) return;
  period=e.target.dataset.p;
  [...document.querySelectorAll(".per")].forEach(b=>b.classList.toggle("on",b===e.target));
  render();
};
function gcalUrl(p){
  const det=(p.st?p.st+" — ":"")+(p.d||"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(p.t+" ("+p.ch+")")
    +"&dates="+icsDate(p.s)+"/"+icsDate(p.e)
    +"&details="+encodeURIComponent(det)
    +"&location="+encodeURIComponent(p.ch);
}
function exportGCal(){
  const map=new Map(PROGS.map(p=>[p.ch+"|"+p.s,p]));
  const ids=[...sel]; if(!ids.length) return;
  if(ids.length>1 && !confirm("vai abrir "+ids.length+" abas do google agenda (uma por programa). seguir?")) return;
  ids.forEach(id=>{ const p=map.get(id); if(p) window.open(gcalUrl(p),"_blank"); });
}

document.getElementById("clear").onclick=()=>{sel.clear(); updateCart(); render();};
document.getElementById("gcal").onclick=exportGCal;

const themeBtn=document.getElementById("theme");
function applyTheme(t){
  document.body.classList.toggle("roxo", t==="roxo");
  themeBtn.textContent = (t==="roxo") ? "tema verde" : "tema roxo";
}
let theme = localStorage.getItem("tvtheme") || "verde";
applyTheme(theme);
themeBtn.onclick=()=>{ theme=(theme==="roxo"?"verde":"roxo"); localStorage.setItem("tvtheme",theme); applyTheme(theme); };

buildDays(); render();
</script>
</body>
</html>
